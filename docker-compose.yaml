name: inboxzero
services:
  ui:
    build: ./ui
    ports:
      - "3000:3000"
    volumes:
      - ./ui:/usr/app  
    networks:
      - inbox-zero-network
    env_file: .env
    # depends_on:
    #   api:
    #     condition: service_healthy
  api:
    build: ./api
    ports:
      - "8000:8000"
    volumes:
      - ./api:/usr/app
    networks:
      - inbox-zero-network
    environment:
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
    #   interval: 5s
    #   timeout: 3s
    #   retries: 5
    #   start_period: 10s

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - inbox-zero-network
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_URL=${REDIS_URL}
  postgres:
    image: postgres:alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - inbox-zero-network
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DATABASE_URL=${DATABASE_URL}

  # AI pipeline worker: same image as `api`, runs the RQ worker instead of uvicorn.
  pipeline:
    build: ./api
    command: ["python", "-m", "app.worker"]
    volumes:
      - ./api:/app # must match WORKDIR in api/Dockerfile
    networks:
      - inbox-zero-network
    env_file: .env
    environment:
      # Override .env's `localhost` values: inside a container, other
      # services are reached by their service name on the compose network.
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - PYTHONUNBUFFERED=1 # show print/log output immediately in `docker compose logs`
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s # let an in-flight job finish on shutdown

volumes:
  redis-data:
  postgres-data:

networks:
  inbox-zero-network:
    driver: bridge